name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
          if [ -d src ]; then .venv/bin/pip install -e .; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sandcastle Node dependencies
        run: npm --prefix .sandcastle ci

      - name: Run full 6-gate verification + tooling self-tests
        run: |
          .venv/bin/python scripts/check.py
          if [ -d tests_tooling ]; then .venv/bin/pytest tests_tooling; fi

      - name: Typecheck & test Sandcastle Drift Watchdog
        run: |
          npm --prefix .sandcastle run typecheck
          npm --prefix .sandcastle test

      - name: Run Hybrid Anti-Bloat Guard (file-size ratchet + vulture + knip + jscpd)
        run: |
          .venv/bin/python scripts/anti_bloat_guard.py --full

      - name: Run Deterministic Adversarial Scan (diff-cover + CrossHair)
        run: |
          .venv/bin/python scripts/adversarial_scan.py --base origin/main
